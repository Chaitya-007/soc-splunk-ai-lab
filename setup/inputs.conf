# Copy to: C:\Program Files\Splunk\etc\system\local\inputs.conf  then restart Splunk
# (create the indexes wineventlog, sysmon, powershell first)

[WinEventLog://Security]
index = wineventlog
renderXml = true
disabled = 0

[WinEventLog://Microsoft-Windows-Sysmon/Operational]
index = sysmon
renderXml = true
source = XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
disabled = 0

[WinEventLog://Microsoft-Windows-PowerShell/Operational]
index = powershell
renderXml = true
disabled = 0
